<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunil Toss King | Toss Channel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background: url('https://images.unsplash.com/photo-1502877338535-766e1452684a') no-repeat center center/cover;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
}

.container{
    background: rgba(0,0,0,0.65);
    width:100%;
    max-width:420px;
    padding:25px 20px;
    text-align:center;
}

.logo{
    width:140px;
    height:140px;
    border-radius:50%;
    margin:0 auto 15px;
    border:4px solid #fff;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    text-align:center;
}

h1{
    font-size:26px;
    margin-bottom:5px;
}

.sub{
    font-size:14px;
    letter-spacing:1px;
    margin-bottom:10px;
    color:#ddd;
}

.stats{
    margin:20px 0;
}

.stats p{
    font-size:18px;
    margin:10px 0;
    color:#ffd700;
    font-weight:bold;
}

.timer{
    margin:20px 0;
}

.timer h2{
    font-size:60px;
    color:#00ff00;
}

.timer p{
    letter-spacing:3px;
    font-weight:bold;
}

.btn{
    margin:20px 0;
}

.btn a{
    display:block;
    background:#00d9ff;
    color:#000;
    padding:15px;
    font-size:20px;
    font-weight:bold;
    text-decoration:none;
    border-radius:8px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

.tagline{
    margin-top:15px;
    font-size:18px;
    color:#ffeb3b;
    font-weight:bold;
}

.disclaimer{
    font-size:11px;
    margin-top:15px;
    color:#ccc;
}
</style>
</head>

    <div class="logo">
        SUNIL<br>TOSS KING
    </div>
